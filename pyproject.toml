[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tetris-ai"
version = "0.1.0"
description = "A headless, turn-based Tetris environment for AI experiments"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]
rl = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
